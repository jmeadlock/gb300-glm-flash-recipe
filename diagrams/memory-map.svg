<text x="70" y="356" fill="#e6edf3" font-size="12" font-weight="bold">full GLM-5.3 FP8 · 704 GB — offload loader peaks &gt; 744 GiB TOTAL machine memory · 3× OOM ✗</text>
<text x="845" y="356" fill="#e6edf3" font-size="14" text-anchor="middle">⇢</text>

