<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-monospace,Menlo,monospace">
<rect width="900" height="440" fill="#0d1117"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<text x="450" y="34" fill="#e6edf3" font-size="19" text-anchor="middle" font-weight="bold">Serving topology — one box, LAN + tailnet, one bearer key</text>

<!-- clients -->
<rect x="40" y="70" width="190" height="86" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="135" y="95" fill="#58a6ff" font-size="13" text-anchor="middle" font-weight="bold">LAN clients</text>
<text x="135" y="116" fill="#8b949e" font-size="11" text-anchor="middle">Macs · fleet · family</text>
<text x="135" y="134" fill="#e6edf3" font-size="11" text-anchor="middle">http://192.168.1.9:30000/v1</text>

<rect x="40" y="180" width="190" height="86" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="135" y="205" fill="#bc8cff" font-size="13" text-anchor="middle" font-weight="bold">Tailnet clients</text>
<text x="135" y="226" fill="#8b949e" font-size="11" text-anchor="middle">remote + shared nodes</text>
<text x="135" y="244" fill="#e6edf3" font-size="11" text-anchor="middle">http://gb300:30000/v1</text>

<rect x="40" y="290" width="190" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-dasharray="5 4"/>
<text x="135" y="315" fill="#f85149" font-size="13" text-anchor="middle" font-weight="bold">Internet</text>
<text x="135" y="337" fill="#8b949e" font-size="11" text-anchor="middle">no route · no Funnel · ever</text>

<!-- auth gate -->
<rect x="300" y="150" width="130" height="90" rx="8" fill="#161b22" stroke="#d29922"/>
<text x="365" y="182" fill="#d29922" font-size="13" text-anchor="middle" font-weight="bold">Bearer key</text>
<text x="365" y="202" fill="#8b949e" font-size="11" text-anchor="middle">single shared</text>
<text x="365" y="218" fill="#8b949e" font-size="11" text-anchor="middle">401 without</text>

<!-- GB300 -->
<rect x="490" y="70" width="370" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="675" y="98" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="bold">DGX Station GB300 · 192.168.1.9</text>

<rect x="510" y="115" width="330" height="105" rx="8" fill="#0d1117" stroke="#3fb950"/>
<text x="675" y="138" fill="#3fb950" font-size="13" text-anchor="middle" font-weight="bold">SGLang :30000 (host net)</text>
<text x="675" y="158" fill="#e6edf3" font-size="11" text-anchor="middle">image glm53-nvfp4-sglang:gb300-v2 (frozen)</text>
<text x="675" y="175" fill="#8b949e" font-size="11" text-anchor="middle">PR #36507 branch · latest transformers</text>
<text x="675" y="192" fill="#8b949e" font-size="11" text-anchor="middle">--restart unless-stopped · warmup after start</text>
<text x="675" y="209" fill="#58a6ff" font-size="11" text-anchor="middle">234 tok/s C1 · 825 agg C8 · TTFT 0.2 s</text>

<rect x="510" y="232" width="160" height="60" rx="8" fill="#0d1117" stroke="#58a6ff"/>
<text x="590" y="255" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="bold">target NVFP4</text>
<text x="590" y="273" fill="#8b949e" font-size="10" text-anchor="middle">182 GB · NVMe</text>

<rect x="680" y="232" width="160" height="60" rx="8" fill="#0d1117" stroke="#bc8cff"/>
<text x="760" y="255" fill="#bc8cff" font-size="12" text-anchor="middle" font-weight="bold">DFlash2 draft</text>
<text x="760" y="273" fill="#8b949e" font-size="10" text-anchor="middle">2.2 GB · block 8</text>

<rect x="510" y="304" width="330" height="50" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="675" y="324" fill="#e6edf3" font-size="11" text-anchor="middle">Ark archive (NAS, read-only fstab automount)</text>
<text x="675" y="341" fill="#8b949e" font-size="10" text-anchor="middle">revision-pinned models + runtime receipts</text>

<!-- BMC -->
<rect x="490" y="390" width="370" height="36" rx="8" fill="#161b22" stroke="#f85149" stroke-dasharray="5 4"/>
<text x="675" y="413" fill="#f85149" font-size="11" text-anchor="middle">BMC: separate NIC · LAN-only · never exposed</text>

<!-- arrows -->
<line x1="230" y1="113" x2="330" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="230" y1="223" x2="300" y2="205" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="430" y1="195" x2="490" y2="180" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="230" y1="325" x2="300" y2="325" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="268" y="316" fill="#f85149" font-size="14" text-anchor="middle">✕</text>
</svg>